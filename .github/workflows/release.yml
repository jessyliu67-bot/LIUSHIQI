name: BIG BANG Release

on:
  push:
    tags: ["v*", "V*"]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt
      - name: Install Chromium for responsive smoke tests
        run: python -m playwright install --with-deps chromium
      - run: python scripts/verify_tag.py "$(git describe --tags --exact-match)"
      - run: python -m compileall -q .
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find static -type f -name '*.js' -print0)
      - run: python scripts/verify_release.py
      - run: python scripts/run_regression_tests.py

  windows-package:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - name: Restore the exact V35 resource archive
        run: python scripts/materialize_resources.py
      - name: Build Windows onedir package
        shell: pwsh
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --name BIG_BANG
          --hidden-import app
          --add-data "static;static"
          --add-data "resources;resources"
          --add-data "data/bigbang.sqlite3;data"
          --add-data "data/ASSET_MANIFEST.json;data"
          --add-data "setup.py;."
          --add-data "wait_for_app.py;."
          desktop_start.py
      - name: Smoke-test Windows executable
        run: python scripts/windows_smoke.py dist/BIG_BANG/BIG_BANG.exe
      - name: Package Windows artifact
        shell: pwsh
        run: Compress-Archive -Path dist/BIG_BANG/* -DestinationPath BIG_BANG_Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BIG_BANG_Windows
          path: BIG_BANG_Windows.zip
          if-no-files-found: error

  publish:
    needs: [validate, windows-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build release inventory
        run: python scripts/build_release_manifest.py --output release-manifest.json
      - uses: actions/download-artifact@v4
        with:
          name: BIG_BANG_Windows
      - uses: softprops/action-gh-release@v2
        with:
          name: BIG BANG Release
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            BIG_BANG_Windows.zip
            release-manifest.json
